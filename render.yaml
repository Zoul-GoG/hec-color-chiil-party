# Render blueprint — one always-on Node service (docs/08-DEPLOYMENT.md §3).
# Fill the 4 secrets in the Render dashboard (sync: false = never committed).
services:
  - type: web
    name: hec-color-chill
    runtime: node
    region: frankfurt
    plan: starter # does not sleep (the free plan does)
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
